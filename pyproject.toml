[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pytoolbox-krish"
version = "0.1.0"
description = "Small, typed Python utilities for the Month 1 AI & Robotics engineering roadmap."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Krish Bisen"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "black>=24", "ruff>=0.6"]

[project.scripts]
pytoolbox = "pytoolbox.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
target-version = "py311"
