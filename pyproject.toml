[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pytoolbox-krish"
version = "0.2.0"
description = "Python utilities and reusable ML engineering patterns."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Krish Bisen", email = "krishbisen4@gmail.com"}]

dependencies = [
    "numpy",
    "pandas",
    "opencv-python",
    "scikit-learn",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "black>=24",
    "ruff>=0.6",
    "debugpy>=1.8",
]

[project.scripts]
pytoolbox = "pytoolbox.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=pytoolbox --cov-report=term-missing --cov-report=xml --cov-fail-under=80"

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
target-version = "py311"
